[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
# Comprehensive CSP for Angular + Firebase + Your Backend
Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://www.gstatic.com https://*.posthog.com;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https: https://*.posthog.com;
      connect-src 'self' https://api.kozpri.com:8443 https://kozpri.com https://*.googleapis.com https://*.firebaseio.com https://*.posthog.com;
      frame-src 'self' https://*.firebaseapp.com;
      worker-src 'self' blob:
      frame-ancestors 'self' https://*.posthog.com;
      base-uri 'self';
      form-action 'self';
    """

# Content-hashed JS/CSS bundles emitted by Angular (outputHashing: all) never change
# content under the same filename, so they can be cached for a year, immutably.
[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Static assets (fonts/images/svgs) are not content-hashed but change rarely.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000"

# index.html must always be revalidated so users get the latest hashed bundle references.
[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

